<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Do it Fast</title>
  </head>
  <body style="background-color: #212121; color: #fff">
    <ul class="language">
      <li>JavaScript</li>
    </ul>
  </body>
  <script>
    //Three steps for it
    //1) What do you want to append, here is li
    //2) In that li what type of value you want to and in which way you want to add it
    //3) where do you want to add this value

    // IN this function the child is appended at the end of the node but the problem is everytime a new child will be aded it will traverse the whole tree, suppose there is 1000 value present already in the tree it will have to traverse the whole tree agian and again

    function appendChild(language) {
      const li = document.createElement("li");
      li.innerHTML = `${language}`;
      document.querySelector(".language").appendChild(li);
    }
    appendChild("python");

    // In this way of appending child or value to list is more optimised,here when the value will be added it will not traverse to end of the node it will directly added to the end

    function rightWaytoappend(language) {
      const li = document.createElement("li");
      li.appendChild(document.createTextNode(language));
      document.querySelector(".language").appendChild(li);
    }

    rightWaytoappend("C++");
    rightWaytoappend("Java");
    //Edit
    const secondLang = document.querySelector("li:nth-child(2)");
    const newLang = document.createElement("li");
    newLang.innerHTML = "Mojo";
    secondLang.replaceWith(newLang);
    //Edit
    const firstLang = document.querySelector("li:first-child");
    firstLang.outerHTML = "<li>TypeScript<li>";
    //Remove
    const removeLang = document.querySelector("li:last-child");
    removeLang.remove();
  </script>
</html>
